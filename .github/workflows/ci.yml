name: CI

# Lint + tests on every push and PR. The release image build lives in
# docker-publish.yml (tags only), so this is the guardrail for day-to-day work.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build blackbox_decode (needed by the decode integration tests)
        run: ./scripts/build_blackbox_tools.sh

      - name: Install dependencies (frozen)
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest -q
