name: Build & publish Docker image

# Builds the image and pushes it to the GitHub Container Registry (ghcr.io).
# No secrets to configure — this uses the built-in GITHUB_TOKEN.
#
# The published image lands at:  ghcr.io/mp5gosu/pidtuner
# Pull it with:                   image: ghcr.io/mp5gosu/pidtuner:latest

on:
  push:
    tags: ["v*"]          # a git tag like v1.2.3 builds AND pushes -> :1.2.3, :1.2, :latest
  pull_request: {}         # PRs build the image (no push) to validate the Dockerfile pre-merge
  workflow_dispatch: {}    # allow manual "Run workflow" from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> mp5gosu/pidtuner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # x86_64 servers
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
