[project]
name = "pidtuner"
version = "0.1.0"
description = "Slim PIDtoolbox-style Betaflight blackbox analyzer (FastAPI + uPlot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Run from backend/ so `from app...` imports resolve without the PYTHONPATH= dance.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Generated dirs and the throwaway Playwright UI drivers stay out of lint.
extend-exclude = ["bin", "data", "tests/drive_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
