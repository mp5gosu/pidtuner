# PIDtuner — run anywhere with `docker compose up -d`.
#
# Uploaded logs are handled fully ephemerally: the server wipes its work
# directory on startup and a reaper prunes anything left inactive for
# PIDTUNER_DATA_TTL_MIN (open browser tabs stay alive via a keepalive heartbeat,
# so an accidental reload isn't a total loss). There is no persistent volume —
# `/data` lives inside the container and is discarded when it is removed. (Add a
# volume mount on `/data` only if you deliberately want scratch data to survive.)

services:
  pidtuner:
    container_name: pidtuner
    build: .
    # image: ghcr.io/mp5gosu/pidtuner:latest   # ← use instead of `build:` to pull the prebuilt image
    restart: unless-stopped
    ports:
      - "8000:8000"               # host:container — change the host port if 8000 is taken
    environment:
      # Inactivity reaper: uploads untouched (no fetch/heartbeat) for this many
      # minutes are pruned (0 disables). Also wiped on startup.
      PIDTUNER_DATA_TTL_MIN: "60"
      # How often (minutes) the reaper runs.
      PIDTUNER_REAP_INTERVAL_MIN: "10"
      # Max upload size in bytes (default 512 MiB).
      PIDTUNER_MAX_UPLOAD_BYTES: "536870912"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
